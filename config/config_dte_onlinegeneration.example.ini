# PLANTILLA SIN CREDENCIALES
# Copiar como config_dte_onlinegeneration.ini en la raíz del proyecto.

[GENERAL]
endpoint = COMPLETAR_ENDPOINT_INTERNO
timeout_segundos = 60
reintentos = 1
pausa_reintento_segundos = 3
args4 = 1
args5 = 2
tipo_foliacion_e72 = 2

[REGLAS]
# false = un CSV sin filas termina correctamente como SIN_DATOS; true = provoca error.
csv_vacio_es_error = false
# 0 = sólo mes actual; 1 = mes actual o mes anterior; 2 = hasta dos meses anteriores.
meses_documento_referencia_nc = 1

[DOCUMENTOS]
glosa_b1 = Servicios de Telecomunicaciones
glosa_nc = Ajuste de Cargo Emitido

[VALORES_POR_DEFECTO]
# Se usan únicamente cuando el campo correspondiente viene vacío en el CSV.
# Un dato presente en el CSV nunca es reemplazado por el INI.
# No existen defaults para RUT, folios, tipos de documento, fechas ni montos.
nombre =
giro =
direccion =
comuna =
ciudad =
email =

[ACEPTA]
rut_emisor = 94675000-K
args0 = 94675000
args1 = COMPLETAR_LOGIN
args2 = COMPLETAR_PASSWORD_O_HASH

[CONDOR]
