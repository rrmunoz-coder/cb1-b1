# PLANTILLA SIN CREDENCIALES
# Copiar como config_dte_onlinegeneration.ini en la raíz del proyecto.
# El archivo local está excluido de GitHub.

[GENERAL]
endpoint = COMPLETAR_ENDPOINT_INTERNO
timeout_segundos = 60
reintentos = 1
pausa_reintento_segundos = 3
args4 = 1
args5 = 2
tipo_foliacion_e72 = 2

[REGLAS]
# 0 = sólo mes actual; 1 = mes actual o mes anterior; 2 = hasta dos meses anteriores.
meses_documento_referencia_nc = 1

[DOCUMENTOS]
glosa_b1 = Servicios de Telecomunicaciones
glosa_nc = Ajuste de Cargo Emitido

[ACEPTA]
rut_emisor = 94675000-K
args0 = 94675000
args1 = COMPLETAR_LOGIN
args2 = COMPLETAR_PASSWORD_O_HASH

[CONDOR]
rut_emisor = 76114143-0
args0 = 76114143
args1 = COMPLETAR_LOGIN
args2 = COMPLETAR_PASSWORD_O_HASH

[ORACLE]
# Credenciales sólo en el archivo local. Nunca subirlas a GitHub.
user = COMPLETAR_USUARIO
password = COMPLETAR_PASSWORD
# Alternativa recomendada: dejar password vacío e indicar una variable de entorno.
password_env =
dsn = COMPLETAR_HOST:1521/SERVICIO

# false = modo Thin, sin Instant Client.
# true = modo Thick; usa client_lib_dir o el cliente configurado en Windows.
thick_mode = false
client_lib_dir =

[EXTRACCION_ORACLE]
# Valores automáticos o fechas YYYY-MM-DD.
fecha_desde = AUTO_MES_ACTUAL
fecha_hasta = AUTO_MES_SIGUIENTE

dias_para_vencimiento = 8
dias_espera_bill_masivo = 2
arraysize = 1000

# 0 = sin límite. Útil para pruebas: 10, 100, etc.
max_filas = 0

[ENTRADA_DEFAULTS]
# NOMBRE se obtiene primero desde NOMBRE_CLARO y luego desde NAME.
# Estos valores sólo se usan si Oracle no entrega el dato.
# Si un dato obligatorio queda vacío, el candidato se envía a rechazados
# y NO se incorpora a reporte_diario.csv.

nombre =
giro =
direccion =
comuna =
ciudad =
email =

# Seguridad para CB1:
# false = exige encontrar la fecha del folio original por
#         FOLIO_REBAJADO = ID_DOC_PPL.
# true  = si no la encuentra, usa EMISION del candidato CB1.
# Activar sólo si se validó que EMISION corresponde al documento rebajado.
usar_emision_candidato_como_fecha_referencia = false
